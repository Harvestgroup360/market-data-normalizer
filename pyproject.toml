[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "market-data-normalizer"
version = "1.19.0"
description = "Normalize heterogeneous market-data feeds (CSV, WebSocket JSON, FIX) into one exchange-agnostic schema."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "HarvestGroup360", email = "github@harvestgroup360.com" }]
keywords = ["market-data", "trading", "fix-protocol", "normalization", "quantitative-finance", "tick-data"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
mdnorm = "mdnorm.cli:main"

[project.urls]
Homepage = "https://harvestgroup360.com"
Repository = "https://github.com/Harvestgroup360/market-data-normalizer"
Changelog = "https://github.com/Harvestgroup360/market-data-normalizer/blob/main/CHANGELOG.md"
Issues = "https://github.com/Harvestgroup360/market-data-normalizer/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/mdnorm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
