name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run tests
        run: pytest -q

  types:
    name: type-check (reporting only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install mypy
      - name: Count what mypy still finds
        # The package is annotated but does not ship a PEP 561 marker, because
        # the annotations do not yet express every invariant the code enforces
        # at runtime. Shipping the marker would push these errors into every
        # dependent's type-checking. The count is printed on every run so it
        # can be watched going down; the job does not fail on it, because a
        # number nobody can see is a number nobody reduces.
        run: mypy src/mdnorm --ignore-missing-imports || true
